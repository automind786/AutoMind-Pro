name: Build AutoMind Pro Hybrid APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Config and Python Files
        run: |
          mkdir -p app/src/main/java/com/automind/agent
          mkdir -p app/src/main/python
          mkdir -p app/src/main/res/drawable

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AutoMindPro"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
              id 'com.chaquo.python' version '15.0.1' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          android.suppressUnsupportedCompileSdk=34
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
              id 'com.chaquo.python'
          }

          android {
              namespace 'com.automind.agent'
              compileSdk 34

              defaultConfig {
                  applicationId "com.automind.agent"
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName "2.0-Pro"

                  ndk {
                      abiFilters "arm64-v8a", "armeabi-v7a"
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_automind_logo.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#131314"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#1E1F20"
                  android:pathData="M18,18h72a16,16 0 0,1 16,16v40a16,16 0 0,1 -16,16h-72a16,16 0 0,1 -16,-16v-40a16,16 0 0,1 16,-16z"/>
              <path
                  android:fillColor="#FF2E2E"
                  android:pathData="M54,28L38,54h14l-6,26l24,-30H54z"/>
              <path
                  android:fillColor="#7CACF8"
                  android:pathData="M34,86h40v3h-40z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"
                  tools:ignore="QueryAllPackagesPermission" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_automind_logo"
                  android:roundIcon="@drawable/ic_automind_logo"
                  android:label="AutoMind"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/python/offline_brain.py
          import json
          import datetime
          import re

          def process_command(user_input, force_offline=False):
              cmd = user_input.lower().strip()

              if "torch on" in cmd or "flashlight on" in cmd or "light jala" in cmd:
                  return json.dumps({
                      "route": "local",
                      "type": "action",
                      "action": "torch_on",
                      "reply": "Offline Python Engine: Flashlight ON kar di gayi hai."
                  })

              if "torch off" in cmd or "flashlight off" in cmd or "light band" in cmd:
                  return json.dumps({
                      "route": "local",
                      "type": "action",
                      "action": "torch_off",
                      "reply": "Offline Python Engine: Flashlight OFF kar di gayi hai."
                  })

              if "wifi" in cmd or "wi-fi" in cmd:
                  return json.dumps({
                      "route": "local",
                      "type": "action",
                      "action": "wifi_settings",
                      "reply": "Wi-Fi settings open kar raha hoon."
                  })

              if "bluetooth" in cmd:
                  return json.dumps({
                      "route": "local",
                      "type": "action",
                      "action": "bluetooth_settings",
                      "reply": "Bluetooth settings open kar raha hoon."
                  })

              if "setting" in cmd:
                  return json.dumps({
                      "route": "local",
                      "type": "action",
                      "action": "open_settings",
                      "reply": "Phone ki Settings open kar raha hoon."
                  })

              if cmd.startswith("open ") or cmd.startswith("kholo "):
                  app_name = cmd.replace("open ", "").replace("kholo ", "").strip()
                  return json.dumps({
                      "route": "local",
                      "type": "action",
                      "action": "open_app",
                      "target": app_name,
                      "reply": f"{app_name.title()} open kiya ja raha hai."
                  })

              if "time" in cmd or "samay" in cmd or "baje" in cmd:
                  now = datetime.datetime.now().strftime("%I:%M %p")
                  return json.dumps({
                      "route": "local",
                      "type": "chat",
                      "reply": f"Abhi samay hua hai {now}."
                  })

              if "date" in cmd or "tarikh" in cmd or "aaj kya din" in cmd:
                  today = datetime.datetime.now().strftime("%A, %d %B %Y")
                  return json.dumps({
                      "route": "local",
                      "type": "chat",
                      "reply": f"Aaj ki tarikh hai: {today}."
                  })

              math_match = re.fullmatch(r'[\d\s\+\-\*\/\(\)\.]+', cmd)
              if math_match and any(op in cmd for op in ['+', '-', '*', '/']):
                  try:
                      ans = eval(cmd)
                      return json.dumps({
                          "route": "local",
                          "type": "chat",
                          "reply": f"Calculation Result: {ans}"
                      })
                  except Exception:
                      pass

              if "kon ho" in cmd or "who are you" in cmd or "tumhara naam" in cmd:
                  return json.dumps({
                      "route": "local",
                      "type": "chat",
                      "reply": "Main AutoMind Pro Hybrid Agent hoon. Mere andar Offline Python Engine aur Online Cloud AI dono ka dimaag juda hua hai."
                  })

              if not force_offline:
                  return json.dumps({
                      "route": "cloud",
                      "type": "chat",
                      "reply": ""
                  })

              return json.dumps({
                  "route": "local",
                  "type": "chat",
                  "reply": f"Offline Python Mode active hai. Aapne kaha: '{user_input}'. Online AI jawab ke liye Internet on karein ya Hybrid mode chunein."
              })
          EOF
                - name: Generate Kotlin UI and Build APK
        run: |
          cat << 'EOF' > app/src/main/java/com/automind/agent/MainActivity.kt
          package com.automind.agent

          import android.Manifest
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.hardware.camera2.CameraManager
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import android.os.Bundle
          import android.provider.Settings
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.View
          import android.widget.EditText
          import android.widget.HorizontalScrollView
          import android.widget.LinearLayout
          import android.widget.PopupMenu
          import android.widget.RelativeLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import com.chaquo.python.Python
          import com.chaquo.python.android.AndroidPlatform
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody.Companion.toRequestBody
          import org.json.JSONObject
          import java.util.Locale
          import java.util.concurrent.TimeUnit

          class MainActivity : AppCompatActivity(), TextToSpeech.OnInitListener {

              private lateinit var prefs: SharedPreferences
              private val client = OkHttpClient.Builder()
                  .connectTimeout(45, TimeUnit.SECONDS)
                  .readTimeout(45, TimeUnit.SECONDS)
                  .build()

              private lateinit var tts: TextToSpeech
              private var isTtsEnabled = true
              private var engineMode = "HYBRID"
              private var speechRecognizer: SpeechRecognizer? = null

              private lateinit var chatContainer: LinearLayout
              private lateinit var chatScrollView: ScrollView
              private lateinit var inputPrompt: EditText
              private lateinit var statusBadge: TextView
              private var thinkingView: View? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  if (!Python.isStarted()) {
                      Python.start(AndroidPlatform(this))
                  }

                  prefs = getSharedPreferences("automind_pro_prefs", Context.MODE_PRIVATE)
                  isTtsEnabled = prefs.getBoolean("tts_enabled", true)
                  engineMode = prefs.getString("engine_mode", "HYBRID") ?: "HYBRID"

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.RECORD_AUDIO), 1)
                  }

                  tts = TextToSpeech(this, this)
                  buildGeminiProUi()

                  addBotBubble("Hello Shahid! AutoMind Pro Hybrid Agent ready hai. Mere andar Offline Python Engine aur Online Cloud Server dono active hain.", "SYSTEM")
              }

              private fun getRenderUrl(): String {
                  return prefs.getString("server_url", "https://automind-agent-3.onrender.com/chat")!!
              }

              private fun dp(v: Int): Int = TypedValue.applyDimension(
                  TypedValue.COMPLEX_UNIT_DIP, v.toFloat(), resources.displayMetrics
              ).toInt()

              private fun scrollToBottom() {
                  chatScrollView.post { chatScrollView.fullScroll(View.FOCUS_DOWN) }
              }

              private fun buildGeminiProUi() {
                  val root = RelativeLayout(this).apply {
                      setBackgroundColor(Color.parseColor("#131314"))
                  }

                  val header = LinearLayout(this).apply {
                      id = View.generateViewId()
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(18), dp(16), dp(14), dp(12))
                      setBackgroundColor(Color.parseColor("#131314"))
                  }

                  val logoBadge = TextView(this).apply {
                      text = "⚡"
                      textSize = 18f
                      setTextColor(Color.parseColor("#FF4B4B"))
                      setPadding(dp(10), dp(6), dp(10), dp(6))
                      background = GradientDrawable().apply {
                          cornerRadius = dp(12).toFloat()
                          setColor(Color.parseColor("#1E1F20"))
                          setStroke(dp(1), Color.parseColor("#333538"))
                      }
                  }

                  val titleBox = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(12), 0, 0, 0)
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }

                  val titleText = TextView(this).apply {
                      text = "automind"
                      textSize = 20f
                      typeface = Typeface.create("sans-serif-medium", Typeface.BOLD)
                      setTextColor(Color.parseColor("#FFFFFF"))
                  }

                  statusBadge = TextView(this).apply {
                      text = "● $engineMode ENGINE"
                      textSize = 11f
                      setTextColor(Color.parseColor("#7CACF8"))
                  }

                  titleBox.addView(titleText)
                  titleBox.addView(statusBadge)

                  val menuBtn = TextView(this).apply {
                      text = "⋮"
                      textSize = 24f
                      setTextColor(Color.parseColor("#E3E3E3"))
                      setPadding(dp(12), dp(4), dp(8), dp(4))
                      setOnClickListener { showTopMenu(it) }
                  }

                  header.addView(logoBadge)
                  header.addView(titleBox)
                  header.addView(menuBtn)

                  val headerParams = RelativeLayout.LayoutParams(
                      RelativeLayout.LayoutParams.MATCH_PARENT, RelativeLayout.LayoutParams.WRAP_CONTENT
                  ).apply { addRule(RelativeLayout.ALIGN_PARENT_TOP) }
                  root.addView(header, headerParams)

                  val bottomPill = LinearLayout(this).apply {
                      id = View.generateViewId()
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(16), dp(4), dp(8), dp(4))
                      background = GradientDrawable().apply {
                          cornerRadius = dp(28).toFloat()
                          setColor(Color.parseColor("#1E1F20"))
                          setStroke(dp(1), Color.parseColor("#333538"))
                      }
                  }

                  inputPrompt = EditText(this).apply {
                      hint = "Ask AutoMind..."
                      setHintTextColor(Color.parseColor("#8E918F"))
                      setTextColor(Color.parseColor("#E3E3E3"))
                      textSize = 15f
                      setBackgroundColor(Color.TRANSPARENT)
                      setPadding(dp(10), dp(12), dp(10), dp(12))
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }

                  val micBtn = TextView(this).apply {
                      text = "🎙"
                      textSize = 20f
                      setPadding(dp(10), dp(10), dp(10), dp(10))
                      setOnClickListener { startVoiceInput() }
                  }

                  val sendBtn = TextView(this).apply {
                      text = "➤"
                      textSize = 18f
                      setTextColor(Color.parseColor("#7CACF8"))
                      setPadding(dp(10), dp(10), dp(10), dp(10))
                      setOnClickListener {
                          val q = inputPrompt.text.toString().trim()
                          if (q.isNotEmpty()) {
                              routeUserCommand(q)
                              inputPrompt.setText("")
                          }
                      }
                  }

                  bottomPill.addView(inputPrompt)
                  bottomPill.addView(micBtn)
                  bottomPill.addView(sendBtn)

                  val bottomParams = RelativeLayout.LayoutParams(
                      RelativeLayout.LayoutParams.MATCH_PARENT, RelativeLayout.LayoutParams.WRAP_CONTENT
                  ).apply {
                      addRule(RelativeLayout.ALIGN_PARENT_BOTTOM)
                      setMargins(dp(16), 0, dp(16), dp(16))
                  }
                  root.addView(bottomPill, bottomParams)

                  val chipsScroll = HorizontalScrollView(this).apply {
                      id = View.generateViewId()
                      isHorizontalScrollBarEnabled = false
                      setPadding(dp(16), 0, dp(16), dp(8))
                  }

                  val chipsRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  val chips = listOf("⚡ Torch on", "💡 Torch off", "🕒 Time kya hai", "▶ Open YouTube", "📶 Wi-Fi", "🧮 245 * 18", "🌍 Space facts")
                  for (c in chips) {
                      val chipView = TextView(this).apply {
                          text = c
                          setTextColor(Color.parseColor("#C4C7C5"))
                          textSize = 13f
                          setPadding(dp(14), dp(8), dp(14), dp(8))
                          background = GradientDrawable().apply {
                              cornerRadius = dp(20).toFloat()
                              setColor(Color.parseColor("#1E1F20"))
                              setStroke(dp(1), Color.parseColor("#2F3133"))
                          }
                          layoutParams = LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT
                          ).apply { setMargins(0, 0, dp(8), 0) }
                          setOnClickListener {
                              val clean = c.replace(Regex("^[⚡💡🕒▶📶🧮🌍]\\s*"), "")
                              routeUserCommand(clean)
                          }
                      }
                      chipsRow.addView(chipView)
                  }
                  chipsScroll.addView(chipsRow)

                  val chipsParams = RelativeLayout.LayoutParams(
                      RelativeLayout.LayoutParams.MATCH_PARENT, RelativeLayout.LayoutParams.WRAP_CONTENT
                  ).apply { addRule(RelativeLayout.ABOVE, bottomPill.id) }
                  root.addView(chipsScroll, chipsParams)

                  chatScrollView = ScrollView(this).apply {
                      isFillViewport = true
                      overScrollMode = View.OVER_SCROLL_NEVER
                  }

                  chatContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(8), dp(16), dp(16))
                  }
                  chatScrollView.addView(chatContainer)

                  val scrollParams = RelativeLayout.LayoutParams(
                      RelativeLayout.LayoutParams.MATCH_PARENT, RelativeLayout.LayoutParams.MATCH_PARENT
                  ).apply {
                      addRule(RelativeLayout.BELOW, header.id)
                      addRule(RelativeLayout.ABOVE, chipsScroll.id)
                  }
                  root.addView(chatScrollView, scrollParams)

                  setContentView(root)
              }

              private fun routeUserCommand(command: String) {
                  addUserBubble(command)
                  showThinking()

                  CoroutineScope(Dispatchers.IO).launch {
                      if (engineMode != "ONLINE_ONLY") {
                          val forceOffline = (engineMode == "OFFLINE_ONLY") || !isInternetAvailable()
                          val pyJson = runEmbeddedPython(command, forceOffline)
                          val route = pyJson.optString("route", "cloud")

                          if (route == "local") {
                              withContext(Dispatchers.Main) {
                                  handleEngineJson(pyJson, "OFFLINE PYTHON")
                              }
                              return@launch
                          }
                      }

                      if (isInternetAvailable()) {
                          val cloudJson = callRenderCloud(command)
                          withContext(Dispatchers.Main) {
                              handleEngineJson(cloudJson, "ONLINE CLOUD")
                          }
                      } else {
                          val fallbackJson = runEmbeddedPython(command, true)
                          withContext(Dispatchers.Main) {
                              handleEngineJson(fallbackJson, "OFFLINE FALLBACK")
                          }
                      }
                  }
              }

              private fun runEmbeddedPython(command: String, forceOffline: Boolean): JSONObject {
                  return try {
                      val py = Python.getInstance()
                      val module = py.getModule("offline_brain")
                      val resultStr = module.callAttr("process_command", command, forceOffline).toString()
                      JSONObject(resultStr)
                  } catch (e: Exception) {
                      JSONObject().apply {
                          put("route", "local")
                          put("type", "chat")
                          put("reply", "Python Engine Error: ${e.message}")
                      }
                  }
              }

              private fun callRenderCloud(prompt: String): JSONObject {
                  return try {
                      val payload = JSONObject().apply { put("message", prompt) }
                      val body = payload.toString().toRequestBody("application/json".toMediaType())
                      val req = Request.Builder().url(getRenderUrl()).post(body).build()
                      val res = client.newCall(req).execute()
                      val str = res.body?.string() ?: "{}"
                      JSONObject(str)
                  } catch (e: Exception) {
                      JSONObject().apply {
                          put("type", "chat")
                          put("reply", "Cloud Server Error: ${e.message}")
                      }
                  }
              }

              private fun handleEngineJson(data: JSONObject, sourceTag: String) {
                  val type = data.optString("type", "chat")
                  val action = data.optString("action", "")
                  val target = data.optString("target", "")
                  val pkg = data.optString("package", "")
                  val reply = data.optString("reply", "Done.")

                  addBotBubble(reply, sourceTag)

                  if (type == "action") {
                      when (action) {
                          "torch_on" -> setTorch(true)
                          "torch_off" -> setTorch(false)
                          "open_settings" -> startActivity(Intent(Settings.ACTION_SETTINGS))
                          "wifi_settings" -> startActivity(Intent(Settings.ACTION_WIFI_SETTINGS))
                          "bluetooth_settings" -> startActivity(Intent(Settings.ACTION_BLUETOOTH_SETTINGS))
                          "open_app" -> openAppByName(target)
                          else -> if (pkg.isNotEmpty()) {
                              packageManager.getLaunchIntentForPackage(pkg)?.let { startActivity(it) }
                          }
                      }
                  }
              }

              private fun openAppByName(name: String) {
                  val pm = packageManager
                  for (app in pm.getInstalledApplications(PackageManager.GET_META_DATA)) {
                      if (pm.getLaunchIntentForPackage(app.packageName) != null) {
                          val label = pm.getApplicationLabel(app).toString().lowercase()
                          if (label.contains(name.lowercase()) || name.lowercase().contains(label)) {
                              pm.getLaunchIntentForPackage(app.packageName)?.let { startActivity(it) }
                              return
                          }
                      }
                  }
                  Toast.makeText(this, "App '$name' phone me nahi mili", Toast.LENGTH_SHORT).show()
              }

              private fun setTorch(enable: Boolean) {
                  try {
                      val cm = getSystemService(Context.CAMERA_SERVICE) as CameraManager
                      cm.setTorchMode(cm.cameraIdList[0], enable)
                  } catch (_: Exception) {}
              }

              private fun isInternetAvailable(): Boolean {
                  val cm = getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                  val cap = cm.getNetworkCapabilities(cm.activeNetwork) ?: return false
                  return cap.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
              }

              private fun showTopMenu(anchor: View) {
                  val popup = PopupMenu(this, anchor)
                  popup.menu.add(0, 1, 0, if (isTtsEnabled) "🔊 Voice: ON" else "🔇 Voice: OFF")
                  popup.menu.add(0, 2, 1, "⚙ Switch Engine ($engineMode)")
                  popup.menu.add(0, 3, 2, "🌐 Change Cloud URL")
                  popup.menu.add(0, 4, 3, "🗑 Clear Chat")

                  popup.setOnMenuItemClickListener { item ->
                      when (item.itemId) {
                          1 -> {
                              isTtsEnabled = !isTtsEnabled
                              prefs.edit().putBoolean("tts_enabled", isTtsEnabled).apply()
                          }
                          2 -> {
                              engineMode = when (engineMode) {
                                  "HYBRID" -> "OFFLINE_ONLY"
                                  "OFFLINE_ONLY" -> "ONLINE_ONLY"
                                  else -> "HYBRID"
                              }
                              prefs.edit().putString("engine_mode", engineMode).apply()
                              statusBadge.text = "● $engineMode ENGINE"
                              Toast.makeText(this, "Mode: $engineMode", Toast.LENGTH_SHORT).show()
                          }
                          
