name: Build AutoMind Pro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Part 1 Setup Gradle 8.5 and Configs
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -P /tmp
          sudo unzip -q -d /opt /tmp/gradle-8.5-bin.zip

          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

          mkdir -p app/src/main/java/com/automind/agent

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AutoMindPro"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          android.suppressUnsupportedCompileSdk=34
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.automind.agent'
              compileSdk 34
              defaultConfig {
                  applicationId "com.automind.agent"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF
      - name: Part 2 Generate Manifest and Activity Base
        run: |
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"
                  tools:ignore="QueryAllPackagesPermission" />
              <application
                  android:allowBackup="true"
                  android:label="AutoMind Pro"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/automind/agent/MainActivity.kt
          package com.automind.agent

          import android.Manifest
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.hardware.camera2.CameraManager
          import android.os.Bundle
          import android.provider.Settings
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.View
          import android.widget.EditText
          import android.widget.HorizontalScrollView
          import android.widget.LinearLayout
          import android.widget.PopupMenu
          import android.widget.RelativeLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody.Companion.toRequestBody
          import org.json.JSONObject
          import java.util.Locale
          import java.util.concurrent.TimeUnit

          class MainActivity : AppCompatActivity(), TextToSpeech.OnInitListener {
              private lateinit var prefs: SharedPreferences
              private val client = OkHttpClient.Builder()
                  .connectTimeout(45, TimeUnit.SECONDS)
                  .readTimeout(45, TimeUnit.SECONDS)
                  .build()
              private lateinit var tts: TextToSpeech
              private var isTtsEnabled = true
              private var speechRecognizer: SpeechRecognizer? = null
              private lateinit var chatContainer: LinearLayout
              private lateinit var chatScrollView: ScrollView
              private lateinit var inputPrompt: EditText
              private var thinkingView: View? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  prefs = getSharedPreferences("automind_prefs", Context.MODE_PRIVATE)
                  isTtsEnabled = prefs.getBoolean("tts_enabled", true)
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.RECORD_AUDIO), 1)
                  }
                  tts = TextToSpeech(this, this)
                  buildUi()
                  addBotBubble("Hello Shahid! AutoMind Pro ready hai.")
              }

              private fun getRenderUrl(): String =
                  prefs.getString("server_url", "https://automind-agent-3.onrender.com/chat")!!

              private fun dp(v: Int): Int = TypedValue.applyDimension(
                  TypedValue.COMPLEX_UNIT_DIP, v.toFloat(), resources.displayMetrics
              ).toInt()

              private fun scrollToBottom() {
                  chatScrollView.post { chatScrollView.fullScroll(View.FOCUS_DOWN) }
              }
          EOF
      - name: Part 3 Append UI Layout Code
        run: |
          cat << 'EOF' >> app/src/main/java/com/automind/agent/MainActivity.kt
              private fun buildUi() {
                  val root = RelativeLayout(this).apply { setBackgroundColor(Color.parseColor("#131314")) }
                  val header = LinearLayout(this).apply {
                      id = View.generateViewId()
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(18), dp(16), dp(18), dp(12))
                      setBackgroundColor(Color.parseColor("#131314"))
                  }
                  val sparkle = TextView(this).apply {
                      text = "✦"
                      textSize = 22f
                      setTextColor(Color.parseColor("#7CACF8"))
                      setPadding(0, 0, dp(10), 0)
                  }
                  val title = TextView(this).apply {
                      text = "AutoMind Pro"
                      textSize = 20f
                      typeface = Typeface.create("sans-serif-medium", Typeface.BOLD)
                      setTextColor(Color.parseColor("#E3E3E3"))
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  val menuBtn = TextView(this).apply {
                      text = "⋮"
                      textSize = 24f
                      setTextColor(Color.parseColor("#C4C7C5"))
                      setPadding(dp(10), dp(4), dp(4), dp(4))
                      setOnClickListener { showSettingsMenu(it) }
                  }
                  header.addView(sparkle)
                  header.addView(title)
                  header.addView(menuBtn)
                  root.addView(header, RelativeLayout.LayoutParams(-1, -2).apply { addRule(RelativeLayout.ALIGN_PARENT_TOP) })

                  val bottomPill = LinearLayout(this).apply {
                      id = View.generateViewId()
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(16), dp(4), dp(8), dp(4))
                      background = GradientDrawable().apply {
                          cornerRadius = dp(28).toFloat()
                          setColor(Color.parseColor("#1E1F20"))
                          setStroke(dp(1), Color.parseColor("#333538"))
                      }
                  }
                  inputPrompt = EditText(this).apply {
                      hint = "Ask AutoMind..."
                      setHintTextColor(Color.parseColor("#8E918F"))
                      setTextColor(Color.parseColor("#E3E3E3"))
                      textSize = 15f
                      setBackgroundColor(Color.TRANSPARENT)
                      setPadding(dp(10), dp(12), dp(10), dp(12))
                      layoutParams = LinearLayout.LayoutParams(0, -2, 1f)
                  }
                  val micBtn = TextView(this).apply {
                      text = "🎙"
                      textSize = 20f
                      setPadding(dp(10), dp(10), dp(10), dp(10))
                      setOnClickListener { startVoiceInput() }
                  }
                  val sendBtn = TextView(this).apply {
                      text = "➤"
                      textSize = 18f
                      setTextColor(Color.parseColor("#7CACF8"))
                      setPadding(dp(10), dp(10), dp(10), dp(10))
                      setOnClickListener {
                          val q = inputPrompt.text.toString().trim()
                          if (q.isNotEmpty()) { submitCommand(q); inputPrompt.setText("") }
                      }
                  }
                  bottomPill.addView(inputPrompt)
                  bottomPill.addView(micBtn)
                  bottomPill.addView(sendBtn)
                  root.addView(bottomPill, RelativeLayout.LayoutParams(-1, -2).apply {
                      addRule(RelativeLayout.ALIGN_PARENT_BOTTOM)
                      setMargins(dp(16), 0, dp(16), dp(16))
                  })

                  val chipsScroll = HorizontalScrollView(this).apply {
                      id = View.generateViewId()
                      isHorizontalScrollBarEnabled = false
                      setPadding(dp(16), 0, dp(16), dp(8))
                  }
                  val chipsLayout = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  for (item in listOf("Torch on", "Torch off", "Open YouTube", "Settings", "Space details")) {
                      val chip = TextView(this).apply {
                          text = item
                          setTextColor(Color.parseColor("#C4C7C5"))
                          textSize = 13f
                          setPadding(dp(14), dp(8), dp(14), dp(8))
                          background = GradientDrawable().apply {
                              cornerRadius = dp(20).toFloat()
                              setColor(Color.parseColor("#1E1F20"))
                              setStroke(dp(1), Color.parseColor("#2F3133"))
                          }
                          layoutParams = LinearLayout.LayoutParams(-2, -2).apply { setMargins(0, 0, dp(8), 0) }
                          setOnClickListener { submitCommand(item) }
                      }
                      chipsLayout.addView(chip)
                  }
                  chipsScroll.addView(chipsLayout)
                  root.addView(chipsScroll, RelativeLayout.LayoutParams(-1, -2).apply { addRule(RelativeLayout.ABOVE, bottomPill.id) })

                  chatScrollView = ScrollView(this).apply { isFillViewport = true }
                  chatContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(8), dp(16), dp(16))
                  }
                  chatScrollView.addView(chatContainer)
                  root.addView(chatScrollView, RelativeLayout.LayoutParams(-1, -1).apply {
                      addRule(RelativeLayout.BELOW, header.id)
                      addRule(RelativeLayout.ABOVE, chipsScroll.id)
                  })
                  setContentView(root)
              }
          EOF
      - name: Part 4 Append Logic and Build APK
        run: |
          cat << 'EOF' >> app/src/main/java/com/automind/agent/MainActivity.kt
              private fun showSettingsMenu(anchor: View) {
                  val popup = PopupMenu(this, anchor)
                  popup.menu.add(0, 1, 0, if (isTtsEnabled) "Voice: ON" else "Voice: OFF")
                  popup.menu.add(0, 2, 1, "Change Server URL")
                  popup.menu.add(0, 3, 2, "Clear Chat")
                  popup.setOnMenuItemClickListener { item ->
                      when (item.itemId) {
                          1 -> { isTtsEnabled = !isTtsEnabled; prefs.edit().putBoolean("tts_enabled", isTtsEnabled).apply() }
                          2 -> showChangeUrlDialog()
                          3 -> { chatContainer.removeAllViews(); addBotBubble("Chat cleared.") }
                      }
                      true
                  }
                  popup.show()
              }

              private fun showChangeUrlDialog() {
                  val input = EditText(this).apply { setText(getRenderUrl()); setPadding(dp(16), dp(16), dp(16), dp(16)) }
                  AlertDialog.Builder(this).setTitle("Server URL").setView(input)
                      .setPositiveButton("Save") { _, _ ->
                          val u = input.text.toString().trim()
                          if (u.isNotEmpty()) prefs.edit().putString("server_url", u).apply()
                      }.setNegativeButton("Cancel", null).show()
              }

              private fun submitCommand(cmd: String) {
                  addUserBubble(cmd)
                  if (handleOfflineAction(cmd)) return
                  showThinking()
                  askCloudAI(cmd)
              }

              private fun addUserBubble(msg: String) {
                  val row = LinearLayout(this).apply { gravity = Gravity.END; setPadding(0, dp(6), 0, dp(6)) }
                  val b = TextView(this).apply {
                      text = msg; setTextColor(Color.parseColor("#E3E3E3")); textSize = 15f
                      setPadding(dp(16), dp(12), dp(16), dp(12))
                      background = GradientDrawable().apply { cornerRadius = dp(20).toFloat(); setColor(Color.parseColor("#282A2C")) }
                      maxWidth = (resources.displayMetrics.widthPixels * 0.80).toInt()
                  }
                  row.addView(b); chatContainer.addView(row); scrollToBottom()
              }

              private fun addBotBubble(msg: String) {
                  removeThinking()
                  val row = LinearLayout(this).apply { gravity = Gravity.START; setPadding(0, dp(6), 0, dp(6)) }
                  val b = TextView(this).apply {
                      text = ""; setTextColor(Color.parseColor("#E3E3E3")); textSize = 15f
                      setPadding(dp(14), dp(10), dp(14), dp(10))
                      background = GradientDrawable().apply {
                          cornerRadius = dp(16).toFloat(); setColor(Color.parseColor("#1E1F20"))
                          setStroke(dp(1), Color.parseColor("#2B2D30"))
                      }
                      maxWidth = (resources.displayMetrics.widthPixels * 0.84).toInt()
                  }
                  row.addView(b); chatContainer.addView(row); scrollToBottom()
                  CoroutineScope(Dispatchers.Main).launch {
                      val sb = StringBuilder()
                      for (w in msg.split(" ")) { sb.append(w).append(" "); b.text = sb.toString(); delay(18); scrollToBottom() }
                  }
                  if (isTtsEnabled) tts.speak(msg, TextToSpeech.QUEUE_FLUSH, null, null)
              }

              private fun showThinking() {
                  val b = TextView(this).apply { text = "✦ Thinking..."; setTextColor(Color.parseColor("#7CACF8")); setPadding(dp(14), dp(8), dp(14), dp(8)) }
                  thinkingView = b; chatContainer.addView(b); scrollToBottom()
              }

              private fun removeThinking() { thinkingView?.let { chatContainer.removeView(it); thinkingView = null } }

              private fun handleOfflineAction(raw: String): Boolean {
                  val c = raw.lowercase().trim()
                  when {
                      c.contains("torch on") -> { toggleTorch(true); addBotBubble("Flashlight ON."); return true }
                      c.contains("torch off") -> { toggleTorch(false); addBotBubble("Flashlight OFF."); return true }
                      c.contains("setting") -> { startActivity(Intent(Settings.ACTION_SETTINGS)); addBotBubble("Opening Settings."); return true }
                      c.startsWith("open") || c.startsWith("kholo") -> {
                          val t = c.replace("open", "").replace("kholo", "").trim()
                          val pm = packageManager
                          for (a in pm.getInstalledApplications(PackageManager.GET_META_DATA)) {
                              if (pm.getLaunchIntentForPackage(a.packageName) != null) {
                                  val l = pm.getApplicationLabel(a).toString().lowercase()
                                  if (l.contains(t) || t.contains(l)) {
                                      startActivity(pm.getLaunchIntentForPackage(a.packageName))
                                      addBotBubble("Opening $t."); return true
                                  }
                              }
                          }
                      }
                  }
                  return false
              }

              private fun toggleTorch(on: Boolean) {
                  try { val cm = getSystemService(Context.CAMERA_SERVICE) as CameraManager; cm.setTorchMode(cm.cameraIdList[0], on) } catch (_: Exception) {}
              }

              private fun askCloudAI(prompt: String) {
                  CoroutineScope(Dispatchers.IO).launch {
                      try {
                          val body = JSONObject().apply { put("message", prompt) }.toString().toRequestBody("application/json".toMediaType())
                          val res = client.newCall(Request.Builder().url(getRenderUrl()).post(body).build()).execute()
                          val data = JSONObject(res.body?.string() ?: "{}")
                          val reply = data.optString("reply", "No response")
                          val pkg = data.optString("package", "")
                          withContext(Dispatchers.Main) {
                              addBotBubble(reply)
                              if (data.optString("type") == "action" && pkg.isNotEmpty()) {
                                  packageManager.getLaunchIntentForPackage(pkg)?.let { startActivity(it) }
                              }
                          }
                      } catch (e: Exception) { withContext(Dispatchers.Main) { addBotBubble("Cloud Error: ${e.message}") } }
                  }
              }

              private fun startVoiceInput() {
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) return
                  speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this)
                  val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE, Locale.getDefault())
                  }
                  speechRecognizer?.setRecognitionListener(object : RecognitionListener {
                      override fun onReadyForSpeech(p: Bundle?) { inputPrompt.hint = "Listening..." }
                      override fun onResults(r: Bundle?) {
                          inputPrompt.hint = "Ask AutoMind..."
                          r?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.get(0)?.let { if (it.isNotEmpty()) submitCommand(it) }
                      }
                      override fun onError(e: Int) { inputPrompt.hint = "Ask AutoMind..." }
                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(v: Float) {}
                      override fun onBufferReceived(b: ByteArray?) {}
                      override fun onEndOfSpeech() {}
                      override fun onPartialResults(p: Bundle?) {}
                      override fun onEvent(t: Int, p: Bundle?) {}
                  })
                  speechRecognizer?.startListening(i)
              }

              override fun onInit(s: Int) { if (s == TextToSpeech.SUCCESS) tts.language = Locale("hi", "IN") }
              override fun onDestroy() { tts.shutdown(); speechRecognizer?.destroy(); super.onDestroy() }
          }
          EOF

          /opt/gradle-8.5/bin/gradle assembleDebug --stacktrace

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoMind-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
